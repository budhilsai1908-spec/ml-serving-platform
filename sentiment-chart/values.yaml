# ---- Application settings ----
image:
  repository: sentiment-api
  tag: v1
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
